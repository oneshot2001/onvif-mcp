<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1600px; height: 500px; overflow: hidden; }
  .banner {
    width: 1600px; height: 500px;
    background: radial-gradient(1200px 700px at 18% 30%, #0e2233 0%, #08131d 45%, #050b11 100%);
    display: flex; align-items: center; justify-content: center; gap: 72px;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Inter, sans-serif;
    position: relative;
  }
  /* faint scanline grid, camera-glass feel */
  .banner::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(94, 234, 212, 0.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(94, 234, 212, 0.035) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .mark { position: relative; width: 220px; height: 220px; flex: 0 0 auto; }
  .text { position: relative; max-width: 860px; }
  h1 {
    font-size: 92px; font-weight: 800; letter-spacing: -2px; color: #f2f7fa;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }
  h1 .dim { color: #3ec9a7; }
  .tag { margin-top: 18px; font-size: 34px; font-weight: 600; color: #c7d5de; letter-spacing: -0.4px; }
  .trip { margin-top: 22px; font-size: 26px; font-weight: 500; color: #6f8494; }
  .trip b { color: #3ec9a7; font-weight: 600; }
  .chain { margin-top: 30px; display: flex; align-items: center; gap: 0; }
  .block {
    width: 118px; height: 10px; border-radius: 6px;
    background: linear-gradient(90deg, #16a085, #3ec9a7);
  }
  .block.deny { background: linear-gradient(90deg, #b0662a, #d98e3b); }
  .link { width: 26px; height: 2px; background: #2a4152; }
</style>
</head>
<body>
<div class="banner">
  <div class="mark">
    <svg viewBox="0 0 220 220" width="220" height="220">
      <!-- doorway frame -->
      <rect x="30" y="18" width="160" height="184" rx="18" fill="none" stroke="#1d3648" stroke-width="7"/>
      <rect x="30" y="18" width="160" height="184" rx="18" fill="#0a1822" opacity="0.6"/>
      <!-- aperture rings -->
      <circle cx="110" cy="96" r="52" fill="none" stroke="#3ec9a7" stroke-width="7"/>
      <circle cx="110" cy="96" r="30" fill="none" stroke="#2a6f60" stroke-width="6"/>
      <circle cx="110" cy="96" r="10" fill="#3ec9a7"/>
      <!-- shutter blades -->
      <g stroke="#2a6f60" stroke-width="5">
        <line x1="110" y1="44" x2="110" y2="66"/>
        <line x1="155" y1="70" x2="136" y2="81"/>
        <line x1="155" y1="122" x2="136" y2="111"/>
        <line x1="110" y1="148" x2="110" y2="126"/>
        <line x1="65" y1="122" x2="84" y2="111"/>
        <line x1="65" y1="70" x2="84" y2="81"/>
      </g>
      <!-- receipt line under aperture -->
      <g>
        <rect x="56" y="164" width="32" height="12" rx="4" fill="#3ec9a7"/>
        <rect x="94" y="164" width="32" height="12" rx="4" fill="#3ec9a7"/>
        <rect x="132" y="164" width="32" height="12" rx="4" fill="#d98e3b"/>
      </g>
    </svg>
  </div>
  <div class="text">
    <h1>onvif<span class="dim">-</span>mcp</h1>
    <div class="tag">A governed doorway between AI agents and video infrastructure</div>
    <div class="trip"><b>Fail-closed policy.</b> <b>Signed receipts.</b> Denials on the record.</div>
    <div class="chain">
      <div class="block"></div><div class="link"></div>
      <div class="block"></div><div class="link"></div>
      <div class="block deny"></div><div class="link"></div>
      <div class="block"></div>
    </div>
  </div>
</div>
</body>
</html>
